name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GONOSUMDB: "*"
  GOPROXY: "https://proxy.golang.org,direct"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone dependencies
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          lock = json.load(open("orchestra.lock"))
          for pkg in lock["packages"]:
              if pkg["type"] == "proto":
                  continue
              url = pkg["source"]["url"]
              path = pkg["path"]
              version = pkg["version"]
              ref = pkg["source"].get("reference", "master")
              result = subprocess.run(["git", "clone", "--depth", "1", "--branch", version, url, path],
                                      capture_output=True)
              if result.returncode != 0:
                  print(f"  Tag {version} not found for {path}, falling back to {ref}")
                  result = subprocess.run(["git", "clone", "--depth", "1", "--branch", ref, url, path],
                                          capture_output=True)
                  if result.returncode != 0:
                      print(f"  FATAL: clone failed for {path}", file=sys.stderr)
                      print(result.stderr.decode(), file=sys.stderr)
                      sys.exit(1)
              print(f"  Cloned {path}")
          PYEOF

      - name: Configure Go env
        run: |
          go env -w GONOSUMDB="*"

      - name: Fix go.sum hashes
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, glob

          # Collect workspace module paths (modules resolved locally via go.work).
          # Their go.sum entries may be stale when tags are force-pushed.
          # Non-workspace orchestra-mcp modules (e.g. plugin-health) must stay.
          lock = json.load(open("orchestra.lock"))
          workspace_mods = set()
          for pkg in lock["packages"]:
              if pkg["type"] == "proto":
                  continue
              name = pkg["source"]["url"].replace("https://github.com/", "github.com/").replace(".git", "")
              workspace_mods.add(name)

          sumfiles = list(glob.glob("**/go.sum", recursive=True)) + ["go.work.sum"]
          for sumfile in sumfiles:
              try:
                  lines = open(sumfile).readlines()
              except FileNotFoundError:
                  continue
              if "/.git/" in sumfile:
                  continue
              kept = [l for l in lines if not any(l.startswith(m + " ") or l.startswith(m + "/") for m in workspace_mods)]
              if len(kept) != len(lines):
                  open(sumfile, "w").writelines(kept)
                  print(f"  Scrubbed {len(lines)-len(kept)} workspace entries from {sumfile}")
          PYEOF

      - name: Generate go.work
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json
          lock = json.load(open("orchestra.lock"))
          paths = [p["path"] for p in lock["packages"] if p["type"] != "proto" and "engine-rag" not in p.get("path","")]
          with open("go.work", "w") as f:
              f.write("go 1.25.0\n\nuse (\n")
              for p in paths:
                  f.write(f"\t./{p}\n")
              f.write(")\n")
          PYEOF
          cat go.work

      - name: Build all binaries
        run: make build

      - name: Run unit tests
        run: make test-unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone dependencies
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          lock = json.load(open("orchestra.lock"))
          for pkg in lock["packages"]:
              if pkg["type"] == "proto":
                  continue
              url = pkg["source"]["url"]
              path = pkg["path"]
              version = pkg["version"]
              ref = pkg["source"].get("reference", "master")
              result = subprocess.run(["git", "clone", "--depth", "1", "--branch", version, url, path],
                                      capture_output=True)
              if result.returncode != 0:
                  print(f"  Tag {version} not found for {path}, falling back to {ref}")
                  result = subprocess.run(["git", "clone", "--depth", "1", "--branch", ref, url, path],
                                          capture_output=True)
                  if result.returncode != 0:
                      print(f"  FATAL: clone failed for {path}", file=sys.stderr)
                      print(result.stderr.decode(), file=sys.stderr)
                      sys.exit(1)
              print(f"  Cloned {path}")
          PYEOF

      - name: Configure Go env
        run: |
          go env -w GONOSUMDB="*"

      - name: Fix go.sum hashes
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, glob

          lock = json.load(open("orchestra.lock"))
          workspace_mods = set()
          for pkg in lock["packages"]:
              if pkg["type"] == "proto":
                  continue
              name = pkg["source"]["url"].replace("https://github.com/", "github.com/").replace(".git", "")
              workspace_mods.add(name)

          sumfiles = list(glob.glob("**/go.sum", recursive=True)) + ["go.work.sum"]
          for sumfile in sumfiles:
              try:
                  lines = open(sumfile).readlines()
              except FileNotFoundError:
                  continue
              if "/.git/" in sumfile:
                  continue
              kept = [l for l in lines if not any(l.startswith(m + " ") or l.startswith(m + "/") for m in workspace_mods)]
              if len(kept) != len(lines):
                  open(sumfile, "w").writelines(kept)
                  print(f"  Scrubbed {len(lines)-len(kept)} workspace entries from {sumfile}")
          PYEOF

      - name: Generate go.work
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json
          lock = json.load(open("orchestra.lock"))
          paths = [p["path"] for p in lock["packages"] if p["type"] != "proto" and "engine-rag" not in p.get("path","")]
          with open("go.work", "w") as f:
              f.write("go 1.25.0\n\nuse (\n")
              for p in paths:
                  f.write(f"\t./{p}\n")
              f.write(")\n")
          PYEOF
          cat go.work

      - name: Vet
        shell: bash
        run: |
          python3 -c 'import json;[print(p["path"]) for p in json.load(open("orchestra.lock"))["packages"] if p["type"] not in ("proto",) and "engine-rag" not in p.get("path","")]' | while read path; do
            echo "go vet ${path}/..."
            (cd "${path}" && go vet ./...)
          done
